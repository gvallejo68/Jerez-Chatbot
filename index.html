    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sherry: {
                50: '#fdf3f2',
                100: '#fbe6e5',
                200: '#f6ced0',
                300: '#eeabba',
                400: '#e37d8e',
                500: '#d55064',
                600: '#bf3449',
                700: '#a02538', // Deep sherry red
                800: '#862232',
                900: '#72202e',

              albero: {
                50: '#fefce8',
                100: '#fef9c3',
                200: '#fef08a',
                300: '#fde047',
                400: '#facc15',
                500: '#eab308', // Bullring sand yellow

    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
